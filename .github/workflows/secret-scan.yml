name: Secret Scan

# This repo is public, so it cannot call the org's reusable workflow in the
# private farpointhq/.github repo (GitHub only shares private-repo workflows
# with other private repos). Every run failed at startup with "workflow file
# issue" for that reason. The org policy is inlined here instead; keep it in
# step with farpointhq/.github/.github/workflows/secret-scan.yml.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # full-history scan on demand
  schedule:
    - cron: "17 6 * * 1" # weekly full-history scan

permissions:
  contents: read

jobs:
  check-secret-files:
    name: Block secret files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secret files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${BEFORE_SHA}..HEAD")
          else
            # Manual/scheduled runs, new branches, force-pushes: check the whole tree.
            FILES=$(git ls-files)
          fi

          BLOCKED_PATTERNS=(
            '\.env$'
            '\.env\.'
            '\.pem$'
            '\.key$'
            'credentials\.json$'
            'service-account.*\.json$'
            'secrets\.ya?ml$'
          )

          FOUND=""
          for pattern in "${BLOCKED_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              FOUND="$FOUND$MATCHES"$'\n'
            fi
          done

          if [ -n "$FOUND" ]; then
            echo "::error::Secret files detected in this changeset:"
            echo "$FOUND" | while read -r f; do
              [ -n "$f" ] && echo "::error::  - $f"
            done
            echo "These file types are blocked by org security policy."
            echo "Use .env.example (without real values) for templates."
            echo "Store secrets in 1Password or GitHub Secrets."
            exit 1
          fi

          echo "No secret files found ($(echo "$FILES" | grep -c . || true) files checked)"

  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On push / pull_request the action scans only the new commits; on
      # workflow_dispatch / schedule it scans the full history.
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          version: 3.99.2
          extra_args: --results=verified,unknown

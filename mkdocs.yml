site_name: Fabric Documentation
site_description: Official documentation for Fabric - AI-powered code assistant
site_url: https://docs.fabric.dev/
repo_url: https://github.com/farpointhq/Fabric-docs
repo_name: farpointhq/Fabric-docs
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ja
        - fr
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_name: Fabric ドキュメント
          nav_translations:
            Getting Started: はじめに
            What Is Fabric?: Fabric とは？
            Onboarding: オンボーディング
            Quickstart: クイックスタート
            Models: モデル
            Explore use cases: ユースケースを見る
            Migrate: 移行
            Using Fabric: Fabric を使う
            App: アプリ
            Basics: 基本
            Settings: 設定
            Code Review: コードレビュー
            Databases: データベース
            Tab Grouping: タブのグループ化
            In-app browser: アプリ内ブラウザ
            Agentic Browser Usage: エージェントによるブラウザ操作
            Slash Commands: スラッシュコマンド
            Built-in Terminal: 組み込みターミナル
            Sub-Agents: サブエージェント
            Directed Acyclic Graph (DAG): 有向非巡回グラフ (DAG)
            Worktrees: ワークツリー
            Core AI Workflows: 主要な AI ワークフロー
            Code Planning: コードプランニング
            Fix Command: Fix コマンド
            Context Window Tracking: コンテキストウィンドウの追跡
            Chat Compaction: チャットの圧縮
            Customize Fabric: Fabric をカスタマイズ
            Permissions: 権限
            Persistent Memory: 永続メモリ
            MCP: MCP
            Skills: スキル
            Skills Marketplace: スキルマーケットプレイス
            Learn: 学ぶ
            Best practices: ベストプラクティス
            Shortcuts: ショートカット
            Cookbooks: クックブック
            Set Up AGENTS.md for Your Project: プロジェクトに AGENTS.md を設定する
            Run a Code Review Workflow: コードレビューのワークフローを実行する
            Research and Summarize with Fabric: Fabric で調査と要約を行う
            Releases: リリース
            Changelog: 変更履歴
        - locale: fr
          name: Français
          build: true
          site_name: Documentation Fabric
          nav_translations:
            Getting Started: Prise en main
            What Is Fabric?: Qu'est-ce que Fabric ?
            Onboarding: Intégration
            Quickstart: Démarrage rapide
            Models: Modèles
            Explore use cases: Explorer les cas d'usage
            Migrate: Migrer
            Using Fabric: Utiliser Fabric
            App: Application
            Basics: Notions de base
            Settings: Paramètres
            Code Review: Revue de code
            Databases: Bases de données
            Tab Grouping: Regroupement d'onglets
            In-app browser: Navigateur intégré
            Agentic Browser Usage: Utilisation du navigateur par l'agent
            Slash Commands: Commandes slash
            Built-in Terminal: Terminal intégré
            Sub-Agents: Sous-agents
            Directed Acyclic Graph (DAG): Graphe orienté acyclique (DAG)
            Worktrees: Arbres de travail (worktrees)
            Core AI Workflows: Flux de travail IA essentiels
            Code Planning: Planification du code
            Fix Command: Commande Fix
            Context Window Tracking: Suivi de la fenêtre de contexte
            Chat Compaction: Compactage de la conversation
            Customize Fabric: Personnaliser Fabric
            Permissions: Autorisations
            Persistent Memory: Mémoire persistante
            MCP: MCP
            Skills: Compétences
            Skills Marketplace: Place de marché des compétences
            Learn: Apprendre
            Best practices: Bonnes pratiques
            Shortcuts: Raccourcis
            Cookbooks: Recettes
            Set Up AGENTS.md for Your Project: Configurer AGENTS.md pour votre projet
            Run a Code Review Workflow: Exécuter un flux de revue de code
            Research and Summarize with Fabric: Rechercher et résumer avec Fabric
            Releases: Versions
            Changelog: Journal des modifications
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/farpointhq/Fabric
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/fabricai
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  version:
    provider: mike
  generator: false

copyright: Copyright &copy; 2025 Farpoint HQ

extra_css:
  - stylesheets/extra.css

nav:
  - Getting Started:
      - What Is Fabric?: index.md
      - Onboarding: getting-started/onboarding/onboarding.md
      - Quickstart: getting-started/quickstart/quickstart.md
      - Models: getting-started/models/models.md
      - Explore use cases: getting-started/explore-use-cases/explore-use-cases.md
      - Migrate: getting-started/migrate/migrate.md
  - Using Fabric:
      - App:
          - Basics: using-fabric/app/basics/basic-functionality.md
          - Settings: using-fabric/app/settings/settings.md
          - Code Review: using-fabric/app/code-review/code-review.md
          - Databases: using-fabric/app/databases/databases.md
          - Tab Grouping: using-fabric/app/tab-grouping/tab-grouping.md
          - In-app browser: using-fabric/app/in-app-browser/in-app-browser.md
          - Agentic Browser Usage: using-fabric/app/agentic-browser-usage/agentic-browser-usage.md
          # - Computer Use: using-fabric/app/computer-use/computer-use.md
          - Slash Commands: using-fabric/app/slash-commands/slash-commands.md
          - Built-in Terminal: using-fabric/app/built-in-terminal/built-in-terminal.md
          - Sub-Agents: using-fabric/app/sub-agents/sub-agents.md
          - Directed Acyclic Graph (DAG): using-fabric/app/directed-acyclic-graph/directed-acyclic-graph.md
          - Worktrees: using-fabric/app/worktrees/worktrees.md
      - Core AI Workflows:
          - Code Planning: using-fabric/core-ai-workflows/code-planning/code-planning.md
          - Fix Command: using-fabric/core-ai-workflows/fix-command/fix-command.md
          - Context Window Tracking: using-fabric/core-ai-workflows/context-window-tracking/context-window-tracking.md
          - Chat Compaction: using-fabric/core-ai-workflows/chat-compaction/chat-compaction.md
  - Customize Fabric:
      - Permissions: customize-fabric/permissions/permissions.md
      - Persistent Memory: customize-fabric/persistent-memory/persistent-memory.md
      - MCP: customize-fabric/mcp/mcp.md
      - Skills: customize-fabric/skills/skills.md
